<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesh — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@0,400;0,500;0,600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080809;--bg2:#0f0f11;--bg3:#161619;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--white:#f4f2ee;--muted:#7a7870;--faint:#3a3835;--accent:#E8C547;--accent2:#D4B03A;--teal:#36c9b0;--r:4px;--r2:8px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;-webkit-font-smoothing:antialiased}
  .card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:2rem;width:100%;max-width:400px}
  .logo{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;color:var(--white);margin-bottom:1.5rem;display:flex;align-items:center;gap:10px}
  .logo-mark{width:22px;height:22px;border:1.5px solid var(--accent);border-radius:4px;display:flex;align-items:center;justify-content:center;background:rgba(232,197,71,0.1)}
  .logo span{color:var(--accent)}
  h2{font-size:18px;font-weight:600;margin-bottom:6px}
  .sub{font-size:13px;color:var(--muted);margin-bottom:1.5rem}
  .field{margin-bottom:14px}
  .label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--faint);margin-bottom:5px;display:block}
  .input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;color:var(--white);font-family:'IBM Plex Sans',sans-serif;font-size:13px;outline:none;transition:border-color .12s}
  .input:focus{border-color:rgba(232,197,71,0.35)}
  .input::placeholder{color:var(--faint)}
  .btn{width:100%;padding:10px;background:var(--accent);border:none;border-radius:var(--r);color:#0a0a0a;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:0.04em;cursor:pointer;transition:background .12s;margin-top:4px}
  .btn:hover{background:var(--accent2)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .msg{font-size:12px;margin-top:12px;font-family:'IBM Plex Mono',monospace;padding:8px 12px;border-radius:var(--r)}
  .msg.ok{background:rgba(54,201,176,0.08);border:1px solid rgba(54,201,176,0.2);color:var(--teal)}
  .msg.err{background:rgba(240,80,80,0.08);border:1px solid rgba(240,80,80,0.2);color:#f08080}
  .back{display:block;text-align:center;margin-top:1rem;font-size:12px;color:var(--muted);text-decoration:none;font-family:'IBM Plex Mono',monospace}
  .back:hover{color:var(--white)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 2h3.5v3.5H2V2zm4.5 0H10v3.5H6.5V2zM2 6.5h3.5V10H2V6.5zm4.5 0H10V10H6.5V6.5z" fill="#E8C547"/></svg>
    </div>
    <span>MES<span>H</span></span>
  </div>
  <h2 id="title">Reset your password</h2>
  <p class="sub" id="subtitle">Enter your new password below.</p>

  <div id="form">
    <div class="field">
      <label class="label" for="pw">New password</label>
      <input class="input" id="pw" type="password" placeholder="At least 6 characters">
    </div>
    <div class="field">
      <label class="label" for="pw2">Confirm password</label>
      <input class="input" id="pw2" type="password" placeholder="Repeat password">
    </div>
    <button class="btn" id="btn" onclick="submit()">RESET PASSWORD →</button>
  </div>
  <div id="msg" class="msg" style="display:none"></div>
  <a class="back" href="/">← Back to Mesh</a>
</div>

<script>
  const token = new URLSearchParams(window.location.search).get('token');
  if (!token) {
    document.getElementById('title').textContent = 'Invalid link';
    document.getElementById('subtitle').textContent = 'This reset link is invalid or has expired.';
    document.getElementById('form').style.display = 'none';
  }

  async function submit() {
    const pw  = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    msg.style.display = 'none';
    if (!pw || pw.length < 6) return show('Password must be at least 6 characters', 'err');
    if (pw !== pw2) return show('Passwords do not match', 'err');

    btn.disabled = true; btn.textContent = 'RESETTING...';
    try {
      const res = await fetch('/api/auth?action=reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw }),
      });
      const data = await res.json();
      if (!data.ok) return show(data.error, 'err');
      show('Password reset! Redirecting to sign in...', 'ok');
      document.getElementById('form').style.display = 'none';
      setTimeout(() => window.location.href = '/?signin=1', 2000);
    } catch(e) {
      show('Something went wrong. Try again.', 'err');
    } finally {
      btn.disabled = false; btn.textContent = 'RESET PASSWORD →';
    }
  }

  function show(text, type) {
    const el = document.getElementById('msg');
    el.textContent = text; el.className = `msg ${type}`; el.style.display = 'block';
  }

  document.getElementById('pw2')?.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
